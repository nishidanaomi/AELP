<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAA: Ranking de Competidores</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="container">

    <header class="cabecalho">
      <h1>Liga Acadêmica de Algoritmos</h1>
      <span id="carimbo" class="carimbo"></span>
    </header>

    <section class="cadastro">
      <h2 class="cadastro-titulo">Adicionar competidor</h2>
      <div class="cadastro-campos">
        <input id="campo-nome" type="text" placeholder="Nome" class="campo">
        <input id="campo-pontuacao" type="number" placeholder="Pontuação" class="campo">
        <input id="campo-idade" type="number" placeholder="Idade" class="campo">
        <button id="btn-adicionar" class="botao">Adicionar</button>
      </div>
      <div class="cadastro-outros">
      <h2 class="ordem-str">Ordenar por:</h2>
      <select id="ordem" class="campo">
        <option value="pontuacao">Pontuação</option>
        <option value="nome">Nome</option>
        <option value="idade">Idade</option>
      </select>
      <p id="aviso" class="aviso"></p>
      </div>
    </section>

    <section id="metricas" class="metricas"></section>

    <div id="podio" class="podio"></div>

    <table class="ranking">
      <thead>
        <tr>
          <th>Posição</th>
          <th>Competidor</th>
          <th>Pontuação</th>
          <th>Idade</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="corpo-ranking"></tbody>
    </table>
  </div>

  <!-- O <script> fica no fim do corpo: assim, quando o ranking.js roda, os
       elementos acima (campos, botão, tabela) já existem e podem ser encontrados. -->
  <script src="ranking.js"></script>
</body>
</html>
